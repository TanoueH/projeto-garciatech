services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - public
      - private

  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.4.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"

      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASS}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: "false"
      N8N_DIAGNOSTICS_CONFIG_BACKEND: "false"

      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODES_EXCLUDE: "[]"
      N8N_RESTRICT_FILE_ACCESS_TO: "/data;/outputs"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./outputs:/outputs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    labels:
      - traefik.enable=true
      - traefik.docker.network=obra_caio_private
      - traefik.http.routers.n8n.rule=Host(`n8n.localhost`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  api_core:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: construction_api:latest
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_EXECUTIVE_USER_ID: ${TELEGRAM_EXECUTIVE_USER_ID:-}
      TELEGRAM_EXECUTIVE_CHAT_ID: ${TELEGRAM_EXECUTIVE_CHAT_ID:-}
      TELEGRAM_API_CORE_URL: ${TELEGRAM_API_CORE_URL:-}
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASS}@postgres:5432/${APP_DB_NAME}
      REDIS_URL: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    labels:
      - traefik.enable=true
      - traefik.docker.network=obra_caio_private
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/status/health')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  agent_worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: construction_agents:latest
    restart: unless-stopped
    command: ["python", "-m", "app.workers.agent_worker"]
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASS}@postgres:5432/${APP_DB_NAME}
      REDIS_URL: redis://redis:6379/1
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private

  rpa_worker:
    build:
      context: .
      dockerfile: Dockerfile.rpa
    image: construction_rpa:latest
    restart: unless-stopped
    command: ["python", "-m", "rpa_worker.main"]
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASS}@postgres:5432/${APP_DB_NAME}
      RPA_HEADLESS: "true"
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    profiles: ["rpa"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - private
    labels:
      - traefik.enable=true
      - traefik.docker.network=obra_caio_private
      - traefik.http.routers.minio.rule=Host(`minio.localhost`)
      - traefik.http.routers.minio.entrypoints=web
      - traefik.http.routers.minio.service=minio-s3
      - traefik.http.services.minio-s3.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`minio-console.localhost`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=America/Sao_Paulo
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - ENV=PROD
      - API_VERSION=v2
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - AUTHENTICATION_TYPE=${EVOLUTION_AUTHENTICATION_TYPE}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1033773198
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - private
    labels:
      - traefik.enable=true
      - traefik.docker.network=obra_caio_private
      - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  dashboard:
    image: nginx:1.27-alpine
    container_name: construction_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8109:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - private
    labels:
      traefik.enable: "true"
      traefik.docker.network: obra_caio_private
      traefik.http.routers.construction-dashboard.entrypoints: web
      traefik.http.routers.construction-dashboard.rule: Host(`control.localhost`)
      traefik.http.services.construction-dashboard.loadbalancer.server.port: "80"

volumes:
  traefik_letsencrypt:
  postgres_data:
  redis_data:
  n8n_data:
  minio_data:
  grafana_data:
  evolution_data:

networks:
  public:
    name: obra_caio_public
    driver: bridge

  private:
    name: obra_caio_private
    driver: bridge
